# =============================================================================
# Railway deployment config (HarnessOS + FORGE)
#
# Railway auto-detects the Dockerfile at the repo root and runs the default
# Docker builder. We keep this file minimal — the healthcheck that was
# here before was misconfigured and caused a 502-style failure on first
# deploy (Railway pings /health during boot before the server is ready).
# =============================================================================

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Restart policy: only restart on non-zero exit. Avoids thrashing.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
