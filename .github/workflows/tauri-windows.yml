name: Build HarnessOS Desktop (Tauri Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.1.0)'
        required: true
        type: string

# Single concurrent build per tag — Tauri builds are heavy (~5-8min on
# Windows runner) and there's no point redoing a release in flight.
concurrency:
  group: tauri-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Tauri .msi (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Bun is required for the sidecar `bun build --compile` step that
      # produces harnessos-server.exe (Tauri's externalBin). The web UI
      # is also built with Vite (which Bun serves faster than Node).
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      # Rust is needed by Tauri 2 (lib.rs, build.rs, sidecar metadata).
      # windows-latest ships with rustup preinstalled; we just add the
      # MSVC target the Tauri toolchain expects.
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # Tauri 2's Windows code path needs the WiX toolset to produce
      # .msi installers. tauri-action handles this implicitly when
      # `tauri.bundle.targets: msi` is set in tauri.conf.json.
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/tauri-shell/src-tauri -> target

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Build the Bun sidecar (harnessos-server.exe) for Windows BEFORE
      # tauri build, so the externalBin lookup finds it. The build
      # scripts rewrite packages/paths/src/bundled-build.ts to set
      # BUNDLED_IS_BINARY=true (so the sidecar embeds the SQL schema
      # instead of reading from the filesystem) and restore it via
      # EXIT trap. Same pattern as the macOS build.
      - name: Build sidecar (harnessos-server.exe)
        env:
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          GIT_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          VERSION="${VERSION#v}"
          GIT_COMMIT="${GIT_COMMIT::8}"
          mkdir -p apps/tauri-shell/src-tauri/bin
          bun build --compile packages/server/src/index.ts \
            --target=bun-windows-x64 \
            --outfile=apps/tauri-shell/src-tauri/bin/harnessos-server.exe
          # Tauri 2 resolves externalBin to <name>-<target-triple> on Windows.
          # Copy so the bundle step finds it.
          cp apps/tauri-shell/src-tauri/bin/harnessos-server.exe \
             apps/tauri-shell/src-tauri/bin/harnessos-server-x86_64-pc-windows-msvc.exe

      - name: Build Tauri .msi
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/tauri-shell
          # Skip updater.json publish — we just want the .msi artifact
          # attached to a GitHub Release in the `release` job below.
          tagName: tauri-build-${{ github.run_id }}
          releaseName: 'Tauri build ${{ github.run_id }}'
          releaseDraft: true
          releaseBody: |
            Tauri desktop build. Attach this .msi to the user-facing
            GitHub Release manually, or trigger from the `release`
            job below to attach automatically.
          args: --target x86_64-pc-windows-msvc --bundles msi

  release:
    name: Attach to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download .msi artifact
        uses: actions/download-artifact@v4
        with:
          name: app
          path: dist
          merge-multiple: true
        # The default artifact name from tauri-action is `app` for the
        # MSI bundle on Windows. Fall back to scanning dist/ if the
        # exact name varies across tauri-action versions.

      - name: Find .msi in dist
        id: find-msi
        run: |
          MSI=$(find dist -name '*.msi' -type f | head -1)
          if [ -z "$MSI" ]; then
            echo "::error::No .msi found in dist/"
            exit 1
          fi
          echo "msi_path=$MSI" >> $GITHUB_OUTPUT
          echo "Found MSI: $MSI"

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Attach .msi to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          files: ${{ steps.find-msi.outputs.msi_path }}
          # If the release already exists (created by release.yml), don't
          # clobber it. softprops merges new assets into the existing release.
          fail_on_unset_files: false
